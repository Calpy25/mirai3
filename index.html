<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>来年のカレンダー</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 24px; color: #222; background: #fff; }
  h1 { text-align: center; font-weight: normal; margin: 0 0 24px; }
  #calendar { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; max-width: 1000px; margin: 0 auto; }
  h2 { font-size: 1rem; margin: 0 0 8px; text-align: center; }
  table { width: 100%; border-collapse: collapse; text-align: center; }
  th, td { padding: 4px 0; font-size: 0.875rem; }
  th { color: #888; font-weight: normal; border-bottom: 1px solid #ddd; }
  .sun { color: #d33; }
  .sat { color: #36c; }
  .today { background: #222; color: #fff; border-radius: 50%; }
  footer { max-width: 600px; margin: 48px auto 0; padding-top: 24px; border-top: 1px solid #ddd; }
  footer h2 { font-size: 1.1rem; margin-bottom: 12px; }
  #feedback-form { display: flex; flex-direction: column; gap: 8px; }
  #feedback-form label { font-size: 0.875rem; color: #555; }
  #feedback-form input, #feedback-form textarea { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
  #feedback-form textarea { min-height: 96px; resize: vertical; }
  #feedback-form button { align-self: flex-end; font: inherit; padding: 8px 24px; border: 0; border-radius: 4px; background: #222; color: #fff; cursor: pointer; }
  #feedback-form button:hover { background: #444; }
  #feedback-list { list-style: none; padding: 0; margin: 24px 0 0; }
  #feedback-list li { padding: 12px 0; border-bottom: 1px solid #eee; }
  #feedback-list .meta { font-size: 0.75rem; color: #888; }
  #feedback-list .body { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  @media print { body { padding: 0; } footer { display: none; } }
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="calendar"></div>
<footer>
  <h2>ご意見板</h2>
  <form id="feedback-form">
    <label for="fb-name">名前</label>
    <input id="fb-name" type="text" maxlength="50" required>
    <label for="fb-text">ご意見</label>
    <textarea id="fb-text" maxlength="1000" required></textarea>
    <button type="submit">送信</button>
  </form>
  <ul id="feedback-list"></ul>
</footer>
<script>
  const year = new Date().getFullYear() + 1;
  const today = new Date();
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  document.getElementById('title').textContent = year + '年';

  let html = '';
  for (let m = 0; m < 12; m++) {
    const first = new Date(year, m, 1).getDay();
    const last = new Date(year, m + 1, 0).getDate();
    html += `<section><h2>${m + 1}月</h2><table><tr>`;
    days.forEach((d, i) => html += `<th class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</th>`);
    html += '</tr><tr>';
    for (let i = 0; i < first; i++) html += '<td></td>';
    for (let d = 1; d <= last; d++) {
      const w = (first + d - 1) % 7;
      const isToday = today.getFullYear() === year && today.getMonth() === m && today.getDate() === d;
      const cls = [w === 0 ? 'sun' : w === 6 ? 'sat' : '', isToday ? 'today' : ''].join(' ').trim();
      html += `<td class="${cls}">${d}</td>`;
      if (w === 6 && d < last) html += '</tr><tr>';
    }
    html += '</tr></table></section>';
  }
  document.getElementById('calendar').innerHTML = html;

  // ご意見板（投稿はこのブラウザの localStorage に保存）
  const FB_KEY = 'calendar-feedback';
  const fbList = document.getElementById('feedback-list');
  const loadFeedback = () => {
    try { return JSON.parse(localStorage.getItem(FB_KEY)) || []; } catch (e) { return []; }
  };
  const renderFeedback = () => {
    fbList.replaceChildren(...loadFeedback().map(f => {
      const li = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${f.name}（${new Date(f.at).toLocaleString('ja-JP')}）`;
      const body = document.createElement('p');
      body.className = 'body';
      body.textContent = f.text;
      li.append(meta, body);
      return li;
    }));
  };
  document.getElementById('feedback-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('fb-name').value.trim();
    const text = document.getElementById('fb-text').value.trim();
    if (!name || !text) return;
    const items = loadFeedback();
    items.unshift({ name, text, at: Date.now() });
    try { localStorage.setItem(FB_KEY, JSON.stringify(items)); } catch (err) {}
    document.getElementById('fb-text').value = '';
    renderFeedback();
  });
  renderFeedback();
</script>
</body>
</html>
